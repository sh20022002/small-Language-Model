name: CI Pipeline

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main
      - feature/**

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
          pip install pytest-cov coverage

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short
        continue-on-error: false

      - name: Measure code coverage
        run: |
          pytest tests/ --cov=src/my_slm --cov-report=xml --cov-report=term-missing
        continue-on-error: false

      - name: Check coverage threshold
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          coverage = float(root.get('line-rate', 0)) * 100
          print(f'Code Coverage: {coverage:.1f}%')
          if coverage < 80:
              print(f'ERROR: Coverage {coverage:.1f}% is below 80% threshold')
              exit(1)
          "

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage.xml

  lint:
    name: Linting & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: |
          pip install flake8 pylint black isort

      - name: Run Black (formatter check)
        run: |
          black --check --diff src/ tests/
        continue-on-error: true

      - name: Run isort (import sorting check)
        run: |
          isort --check-only --diff src/ tests/
        continue-on-error: true

      - name: Run Flake8
        run: |
          flake8 src/ tests/ \
            --count \
            --statistics \
            --max-line-length=100 \
            --ignore=E501,W503,E203
        continue-on-error: true

      - name: Run Pylint
        run: |
          pylint src/ --exit-zero --disable=fixme
        continue-on-error: true

  typecheck:
    name: Type Checking with mypy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install mypy
        run: |
          pip install mypy numpy torch

      - name: Run mypy type checking
        run: |
          mypy src/ --ignore-missing-imports --no-error-summary
        continue-on-error: true

  build:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: [test, lint, typecheck]
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          pip install build twine

      - name: Build distribution
        run: |
          python -m build

      - name: Validate build artifacts
        run: |
          twine check dist/*
        continue-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: distribution-package
          path: dist/
