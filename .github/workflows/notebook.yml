name: Notebook Validation

on:
  push:
    branches:
      - main
      - feature/**
    paths:
      - "*.ipynb"
      - "notebooks/**/*.ipynb"
      - "src/**/*.py"
      - "tests/**/*.py"
  pull_request:
    branches:
      - main
      - feature/**

jobs:
  validate-notebook-structure:
    name: Validate Notebook JSON Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install validation tools
        run: |
          pip install nbformat jsonschema

      - name: Validate notebook JSON
        run: |
          python scripts/validate_notebooks.py
        continue-on-error: false

  test-kaggle-notebook:
    name: Test Kaggle Notebook (Simulated)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install torch numpy tqdm

      - name: Create stub Kaggle environment
        run: |
          mkdir -p /tmp/kaggle_input/example_model_instance
          echo '{"version": 1}' > /tmp/kaggle_input/example_model_instance/metadata.json

      - name: Parse and extract notebook cells
        run: |
          python scripts/test_notebook_cells.py \
            --notebook kaggle_dual_gpu_finetune.ipynb \
            --output /tmp/extracted_cells.py
        continue-on-error: false

      - name: Verify notebook paths
        run: |
          python scripts/check_notebook_paths.py
        continue-on-error: false

      - name: Validate notebook imports
        run: |
          python scripts/validate_imports.py
        continue-on-error: false
