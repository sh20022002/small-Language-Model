[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-tokenizer"
version = "0.2.0"
description = "Hybrid tokenizer + tiny Transformer training utilities."
readme = "README.md"
authors = [{ name = "shmuel toren", email = "shmuel.tor@gmail.com" }]
license = { text = "MIT" }
# torch>=2.6.0 (below) dropped Python 3.8 support upstream, so the floor here
# must track it — pip would otherwise advertise 3.8 support and then fail to
# resolve a torch wheel at install time. Keep these two in sync.
requires-python = ">=3.9"
keywords = ["tokenizer", "nlp", "transformer", "pytorch"]
dependencies = [
    # torch>=2.6 is a hard floor, not a style choice: CVE-2025-32434 is a
    # critical (CVSS 9.3) RCE in torch.load() that affects every version
    # <=2.5.1 EVEN WHEN weights_only=True is passed. This project loads
    # checkpoints from Kaggle datasets that may be attached by third
    # parties, so the fix must not be optional. See SECURITY.md.
    "torch>=2.6.0",
    "numpy>=1.21",
    "tqdm>=4.60",
    "matplotlib>=3.5",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest", "black", "isort", "ruff"]

[project.urls]
Homepage = "https://github.com/sh20022002/small-Language-Model"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["my_slm", "my_slm.*"]

[tool.setuptools.package-data]
my_slm = ["data/*.pkl.gz", "data/*.json", "data/*.txt", "data/*.yaml", "data/*.yml"]
